[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sim-plugin-hypermesh"
version = "0.1.0"
description = "Altair HyperMesh driver for sim-cli, distributed as an out-of-tree plugin"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Weiqi Ji", email = "jiweiqi10@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    # sim-runtime brings the runtime contract (sim.driver, sim.runner,
    # sim.compat). HyperMesh's `hm` Python API ships inside the HyperWorks
    # Desktop installation and is not on PyPI — see LICENSE-NOTICE.md.
    "sim-runtime @ git+https://github.com/svd-ai-lab/sim-cli@main",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[project.entry-points."sim.drivers"]
hypermesh = "sim_plugin_hypermesh:HyperMeshDriver"

[project.entry-points."sim.skills"]
hypermesh = "sim_plugin_hypermesh:skills_dir"

[project.urls]
Homepage = "https://github.com/svd-ai-lab/sim-plugin-hypermesh"
Issues = "https://github.com/svd-ai-lab/sim-plugin-hypermesh/issues"

[tool.hatch.metadata]
# Required because `sim-runtime` is pinned to a git+https URL — sim-cli is
# distributed via GitHub, not PyPI. See sim-proj memory: plugin distribution
# is GitHub-only.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sim_plugin_hypermesh"]
